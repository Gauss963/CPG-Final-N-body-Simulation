name: macOS CI and Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Flang
        run: brew install flang

      - name: Build C++ backend with Clang
        run: clang++ -std=c++17 -O2 code/Simulation.cc code/random_mt.cc -o "$RUNNER_TEMP/Simulation_cc"

      - name: Build Fortran backend with Flang
        run: |
          "$(brew --prefix flang)/bin/flang" -O2 code/Simulation.f90 -o "$RUNNER_TEMP/Simulation_FF"

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create v1.0.0 release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.0.0
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping."
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "$GITHUB_REPOSITORY $TAG" \
              --generate-notes
          fi
