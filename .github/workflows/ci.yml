name: macOS CI and Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Flang and OpenMP runtime
        run: brew install flang libomp

      - name: Build C++ backend with Clang
        run: clang++ -std=c++17 -O2 code/Simulation.cc code/random_mt.cc -o "$RUNNER_TEMP/Simulation_cc"

      - name: Test C++ Barnes–Hut solver
        run: |
          clang++ -std=c++17 -O2 code/test_barnes_hut.cc -o "$RUNNER_TEMP/test_barnes_hut"
          "$RUNNER_TEMP/test_barnes_hut"

      - name: Build Fortran backend with Flang
        run: |
          "$(brew --prefix flang)/bin/flang" -O2 code/Simulation.f90 -o "$RUNNER_TEMP/Simulation_FF"

      - name: Compare C++ and Fortran diagnostics
        run: python3 code/compare_backends.py "$RUNNER_TEMP/Simulation_cc" "$RUNNER_TEMP/Simulation_FF" --check

      - name: Check C++ OpenMP diagnostics
        run: |
          omp_prefix="$(brew --prefix libomp)"
          clang++ -std=c++17 -O2 -Xpreprocessor -fopenmp -I"$omp_prefix/include" \
            code/Simulation.cc code/random_mt.cc -L"$omp_prefix/lib" -Wl,-rpath,"$omp_prefix/lib" \
            -lomp -o "$RUNNER_TEMP/Simulation_cc_omp"
          python3 code/benchmark_openmp.py --check --binaries "$RUNNER_TEMP/Simulation_cc" "$RUNNER_TEMP/Simulation_cc_omp"

      - name: Stage macOS executables
        run: |
          mkdir -p "$RUNNER_TEMP/release-assets"
          cp "$RUNNER_TEMP/Simulation_cc" "$RUNNER_TEMP/release-assets/CPG-Final-N-body-Simulation-cpp-macos-arm64"
          cp "$RUNNER_TEMP/Simulation_FF" "$RUNNER_TEMP/release-assets/CPG-Final-N-body-Simulation-fortran-macos-arm64"

      - name: Upload macOS executables
        uses: actions/upload-artifact@v4
        with:
          name: macos-executables
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download macOS executables
        uses: actions/download-artifact@v4
        with:
          name: macos-executables
          path: ${{ runner.temp }}/release-assets

      - name: Create or update v1.0.0 release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.0.0
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "$GITHUB_REPOSITORY $TAG" \
              --generate-notes
          fi
          gh release upload "$TAG" "$RUNNER_TEMP"/release-assets/* --clobber
